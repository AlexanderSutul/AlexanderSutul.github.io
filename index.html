<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <link rel="alternate" hreflang="en" href="./" />
    <link rel="alternate" hreflang="de" href="./de/" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="card">
      <nav
        class="language-switch"
        aria-label=""
        data-i18n-aria-label="languageLabel"
      >
        <button
          type="button"
          data-language="en"
          data-i18n="languageEn"
          aria-pressed="true"
        ></button>
        <button
          type="button"
          data-language="de"
          data-i18n="languageDe"
          lang="de"
          aria-pressed="false"
        ></button>
      </nav>

      <div class="badge" data-i18n="badge"></div>

      <h1>
        <span data-i18n="firstName"></span><br /><span
          data-i18n="lastName"
        ></span
        ><span class="cursor" data-i18n="cursor"></span>
      </h1>

      <h2 data-i18n="headline"></h2>

      <p class="location" data-i18n="location"></p>

      <p class="status" data-i18n="status"></p>

      <p class="intro" data-i18n="intro"></p>

      <div class="skills">
        <div class="skill" data-i18n="skillTypeScript"></div>
        <div class="skill" data-i18n="skillFrontend"></div>
        <div class="skill" data-i18n="skillBackend"></div>
        <div class="skill" data-i18n="skillApis"></div>
        <div class="skill" data-i18n="skillGo"></div>
        <div class="skill" data-i18n="skillNode"></div>
        <div class="skill" data-i18n="skillAws"></div>
        <div class="skill" data-i18n="skillAiIntegration"></div>
        <div class="skill" data-i18n="skillAiAgents"></div>
        <div class="skill" data-i18n="skillSql"></div>
        <div class="skill" data-i18n="skillTesting"></div>
      </div>

      <section class="section" aria-labelledby="experience-title">
        <h2
          class="section-title"
          id="experience-title"
          data-i18n="experience"
        ></h2>
        <div class="timeline">
          <article class="role">
            <h3 data-i18n="iuTitle"></h3>
            <div class="role-meta" data-i18n="iuMeta"></div>
            <p data-i18n="iuDescription"></p>
            <div class="role-stack" data-i18n="iuStack"></div>
          </article>

          <article class="role">
            <h3 data-i18n="northTitle"></h3>
            <div class="role-meta" data-i18n="northMeta"></div>
            <ul>
              <li data-i18n="northBullet1"></li>
              <li data-i18n="northBullet2"></li>
              <li data-i18n="northBullet3"></li>
              <li data-i18n="northBullet4"></li>
            </ul>
            <div class="role-stack" data-i18n="northStack"></div>
          </article>

          <article class="role">
            <h3 data-i18n="epamTitle"></h3>
            <div class="role-meta" data-i18n="epamMeta"></div>
            <p data-i18n="epamDescription"></p>
            <div class="role-stack" data-i18n="epamStack"></div>
          </article>

          <article class="role">
            <h3 data-i18n="unlimitTitle"></h3>
            <div class="role-meta" data-i18n="unlimitMeta"></div>
            <p data-i18n="unlimitDescription"></p>
            <div class="role-stack" data-i18n="unlimitStack"></div>
          </article>

          <article class="role">
            <h3 data-i18n="monastirevTitle"></h3>
            <div class="role-meta" data-i18n="monastirevMeta"></div>
            <p data-i18n="monastirevDescription"></p>
            <div class="role-stack" data-i18n="monastirevStack"></div>
          </article>

          <article class="role">
            <h3 data-i18n="ovitaTitle"></h3>
            <div class="role-meta" data-i18n="ovitaMeta"></div>
            <ul>
              <li data-i18n="ovitaBullet1"></li>
              <li data-i18n="ovitaBullet2"></li>
              <li data-i18n="ovitaBullet3"></li>
              <li data-i18n="ovitaBullet4"></li>
              <li data-i18n="ovitaBullet5"></li>
            </ul>
            <div class="role-stack" data-i18n="ovitaStack"></div>
          </article>
        </div>
      </section>

      <div class="links">
        <a
          href="https://de.linkedin.com/in/asutulov"
          target="_blank"
          data-i18n="linkedin"
        ></a>
        <a href="mailto:sutulovalexander@gmail.com" data-i18n="email"></a>
      </div>

      <div class="footer" data-i18n="footer"></div>
    </main>
    <script src="./translations.js"></script>
  </body>
</html>
