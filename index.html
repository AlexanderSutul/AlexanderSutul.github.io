<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aleksandr Sutulov</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Courier New", monospace;
        background:
          linear-gradient(#121212 1px, transparent 1px),
          linear-gradient(90deg, #121212 1px, transparent 1px), #0b0f1a;
        background-size: 24px 24px;
        color: #f5f5f5;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .card {
        width: 100%;
        max-width: 760px;
        background: #151a2e;
        border: 4px solid #f6d365;
        box-shadow: 12px 12px 0 #000;
        padding: 32px;
      }

      .badge {
        display: inline-block;
        background: #ff4d6d;
        color: white;
        padding: 8px 12px;
        border: 3px solid #000;
        box-shadow: 4px 4px 0 #000;
        margin-bottom: 24px;
        font-weight: bold;
      }

      h1 {
        font-size: clamp(36px, 8vw, 72px);
        line-height: 1;
        margin: 0 0 16px;
        color: #7bdff2;
        text-shadow: 4px 4px 0 #000;
      }

      h2 {
        color: #f6d365;
        margin-top: 0;
        font-size: 22px;
      }

      p {
        font-size: 18px;
        line-height: 1.6;
        color: #d7e3fc;
      }

      .skills {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin: 28px 0;
      }

      .skill {
        background: #1f7a8c;
        border: 3px solid #000;
        box-shadow: 4px 4px 0 #000;
        padding: 10px 14px;
        font-weight: bold;
      }

      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        margin-top: 32px;
      }

      a {
        color: #000;
        background: #f6d365;
        text-decoration: none;
        font-weight: bold;
        padding: 14px 18px;
        border: 3px solid #000;
        box-shadow: 5px 5px 0 #000;
        transition: 0.12s;
      }

      a:hover {
        transform: translate(3px, 3px);
        box-shadow: 2px 2px 0 #000;
        background: #7bdff2;
      }

      .footer {
        margin-top: 32px;
        font-size: 14px;
        color: #9aa4c7;
      }

      .cursor {
        animation: blink 1s steps(2, start) infinite;
      }

      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">AVAILABLE FOR QUESTS</div>

      <h1>Aleksandr<br />Sutulov<span class="cursor">_</span></h1>

      <h2>Software Engineer / Pixel Adventurer</h2>

      <p>Hi! I'm a software engineer, I like clean code and AI.</p>

      <div class="skills">
        <div class="skill">Go</div>
        <div class="skill">TypeScript</div>
        <div class="skill">iOS soon</div>
      </div>

      <p>My projects</p>

      <div class="links">
        <a href="https://github.com/sutulovalexander" target="_blank">GitHub</a>
        <a href="mailto:sutulovalexander@gmail.com">Email</a>
      </div>

      <div class="footer">© 2026 · built with HTML, CSS and 8-bit energy</div>
    </main>
  </body>
</html>
